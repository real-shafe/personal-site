<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weasel Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A110B; --paper:#FFFDF7; --red:#D8382C; --gold:#FFC83D; --bg:#3F86DA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3F86DA}}
:root[data-theme="dark"]{--bg:#3F86DA}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Lilita One',system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{
  position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;
}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.coins{
  display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:4px 14px 4px 5px;box-shadow:0 4px 0 var(--ink);font-size:26px;line-height:1;transform-origin:left center;
}
.coins.pop{animation:pop .25s ease-out}
@keyframes pop{40%{transform:scale(1.18) rotate(-4deg)}}
.coin-icon{width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid #5A3A08;box-sizing:border-box;box-shadow:inset -3px -3px 0 #E39A12}
.dist{font-size:18px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;padding-left:4px}
.combo{font-size:22px;color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;padding-left:4px;opacity:0;transition:opacity .12s}
.combo.on{opacity:1}
.btns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.btn{
  font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;
  padding:6px 10px;box-shadow:0 3px 0 var(--ink);cursor:pointer;
}
.btn[aria-pressed="false"]{opacity:.62}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}
.panel{
  background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);
  padding:22px 26px 20px;max-width:360px;text-align:center;animation:drop .45s cubic-bezier(.3,1.6,.5,1);
}
@keyframes drop{from{transform:translateY(-40px) scale(.85);opacity:0}}
.panel h1{
  margin:0 0 12px;font-size:50px;line-height:1;font-weight:400;color:var(--red);
  -webkit-text-stroke:9px var(--ink);paint-order:stroke fill;letter-spacing:.5px;
}
.panel p{margin:0 0 8px;font-size:19px;line-height:1.3}
.panel .go{margin-top:14px;font-size:23px;color:var(--red);display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.banner{
  position:fixed;left:0;right:0;top:24%;text-align:center;font-size:46px;color:#fff;
  -webkit-text-stroke:10px var(--ink);paint-order:stroke fill;pointer-events:none;opacity:0;padding:0 16px;
}
.banner.show{animation:banner 2.4s ease-out}
@keyframes banner{0%{opacity:0;transform:translateY(-30px) scale(.7)}12%{opacity:1;transform:scale(1.06)}20%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
@keyframes fadeonly{10%,80%{opacity:1}}
@media (prefers-reduced-motion:reduce){.panel,.panel .go,.coins.pop{animation:none}.banner.show{animation:fadeonly 2.4s}}
.hidden{display:none}
.powers{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.pill{
  display:flex;align-items:center;gap:7px;font-size:15px;background:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:2px 10px 2px 4px;box-shadow:0 3px 0 var(--ink);
}
.pill i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:inline-block;box-sizing:border-box}
.pill .bar{width:46px;height:7px;border-radius:4px;background:#E5DCCB;overflow:hidden}
.pill .bar b{display:block;height:100%;border-radius:4px}
.pill.ending{animation:blinkpill .3s steps(2) infinite}
@keyframes blinkpill{50%{opacity:.4}}
@media (max-width:440px){.btn{font-size:13px;padding:5px 8px}.panel h1{font-size:42px}.banner{font-size:34px}.coins{font-size:22px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Weasel Run game"></canvas>

<div class="hud">
  <div class="stat">
    <div class="coins" id="coinsBox"><span class="coin-icon" aria-hidden="true"></span><span id="coins">0</span></div>
    <div class="dist" id="dist">0 m</div>
    <div class="combo" id="combo" aria-live="polite"></div>
    <div class="powers" id="powers"></div>
  </div>
  <div class="btns">
    <button class="btn" id="musicBtn" type="button" aria-pressed="true">Music on</button>
    <button class="btn" id="sfxBtn" type="button" aria-pressed="true">Sounds on</button>
  </div>
</div>

<div class="banner" id="banner"></div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h1>Weasel Run</h1>
    <p>Tap to jump. Tap again in the air to double jump.</p>
    <p>Chain coins for combos, bop critters on the head and grab bubbles for power-ups.</p>
    <div class="go">Tap to start</div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const elCoins = $('coins'), elCoinsBox = $('coinsBox'), elDist = $('dist'), elCombo = $('combo');
const overlay = $('overlay'), panel = $('panel'), banner = $('banner'), musicBtn = $('musicBtn'), sfxBtn = $('sfxBtn');

const TAU = Math.PI * 2;
const G = 1900, JV = 640, DJV = 600, SPRING = 1000;
const BASE = 235, MAXS = 430, ACC = 0.0055;
const BIOME_LEN = 5200, PW = 24, PH = 48, UPM = 32;

let VW = 560, VH = 360, SC = 1, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SC = Math.min(innerHeight / 360, innerWidth / 560);
  VW = innerWidth / SC; VH = innerHeight / SC;
  cv.width = Math.round(innerWidth * DPR); cv.height = Math.round(innerHeight * DPR);
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rand = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pick(w){ let s = 0; for (const x of w) s += x; let r = Math.random() * s; for (let i = 0; i < w.length; i++){ r -= w[i]; if (r <= 0) return i; } return w.length - 1; }
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexCache = {};
function rgb(h){ return hexCache[h] || (hexCache[h] = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]); }
function mix(a, b, t){ const A = rgb(a), B = rgb(b); return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`; }
function airtime(v, dh){ const d = v*v - 2*G*dh; return d < 0 ? 0 : (v + Math.sqrt(d)) / G; }
function reach1(sp, dh){ return sp * airtime(JV, dh); }
function reach2(sp, dh){ const h1 = JV*JV/(2*G), t1 = JV/G, d = DJV*DJV + 2*G*(h1 - dh); return sp * (t1 + (DJV + Math.sqrt(Math.max(0, d))) / G); }
function rrect(x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function rr(x, y, w, h, rt, rb){
  ctx.beginPath();
  ctx.moveTo(x + rt, y); ctx.lineTo(x + w - rt, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rt);
  ctx.lineTo(x + w, y + h - rb); if (rb) ctx.quadraticCurveTo(x + w, y + h, x + w - rb, y + h);
  ctx.lineTo(x + rb, y + h); if (rb) ctx.quadraticCurveTo(x, y + h, x, y + h - rb);
  ctx.lineTo(x, y + rt); ctx.quadraticCurveTo(x, y, x + rt, y); ctx.closePath();
}

// ---------- biomes ----------
const BIOMES = [
  { name:'The Meadow', skyTop:'#3F86DA', skyBot:'#BFE3FF', far:'#9BB6D8', farDark:'#7F9CC4', mid:'#73B85E', midDark:'#4F9A45',
    top:'#7CC74A', topDark:'#4C8F2A', topHi:'#A8E06E', body:'#B39A7A', bodyAlt:'#A38A6B', bodyDark:'#7A6550', line:'#1A110B',
    capH:13, dust:'#EEF3E2', rock:'#B7B0A3', deco:['flower','flower','tuft','tuft','bush'], cols:['#FF7BA9','#FFE066','#FFFFFF','#B48CFF'] },
  { name:'Sunscorch Desert', skyTop:'#E9864A', skyBot:'#FFE1A3', far:'#DC8E5E', farDark:'#BD7048', mid:'#EBB86C', midDark:'#D49A50',
    top:'#F7D78E', topDark:'#D9AD5E', topHi:'#FFF0C2', body:'#CF9255', bodyAlt:'#BF8046', bodyDark:'#9A6234', line:'#2E1A0C',
    capH:10, dust:'#F5D9A0', rock:'#C9A27A', deco:['cactus','rock','dry','cactus','dry'], cols:['#FF6FA8','#FFE066'] },
  { name:'Frostpeak Mountains', skyTop:'#5C84B3', skyBot:'#DDEBF7', far:'#93AACB', farDark:'#7088AA', mid:'#3F6562', midDark:'#2C4C4A',
    top:'#F5F9FD', topDark:'#B9CEE2', topHi:'#FFFFFF', body:'#7E8994', bodyAlt:'#6E7884', bodyDark:'#525C67', line:'#18202A',
    capH:12, dust:'#FFFFFF', rock:'#8C97A3', deco:['pine','pine','snowrock','pine'], cols:['#FFFFFF'] },
  { name:'Glowcap Forest', skyTop:'#1E1943', skyBot:'#6B4585', far:'#3A2E66', farDark:'#2C2352', mid:'#2B2452', midDark:'#1E1940',
    top:'#5FBF8F', topDark:'#3A8A66', topHi:'#9BF0C2', body:'#4E3F66', bodyAlt:'#45385B', bodyDark:'#30263F', line:'#100C1E',
    capH:10, dust:'#B5F5D5', rock:'#5E5076', deco:['mush','mush','fern','crystal'], cols:['#6FF0D6','#FF7AD9','#9D8CFF'] },
];
function biomeIdx(x){ return Math.floor(Math.max(0, x) / BIOME_LEN) % 4; }
function biomeBlend(x){
  const xx = Math.max(0, x), i = biomeIdx(xx), local = xx % BIOME_LEN;
  const t = local > BIOME_LEN * 0.85 ? (local - BIOME_LEN * 0.85) / (BIOME_LEN * 0.15) : 0;
  return { i, j:(i + 1) % 4, t };
}
function segBiome(x){ const b = biomeBlend(x); return Math.random() < b.t ? b.j : b.i; }

// ---------- settings ----------
let best = { coins:0, dist:0 };
try { const b = JSON.parse(localStorage.getItem('weasel-best')); if (b && typeof b.coins === 'number') best = { coins:b.coins, dist:b.dist || 0 }; } catch(e){}
let musicOn = true, sfxOn = true;
try { musicOn = localStorage.getItem('weasel-music') !== '0'; sfxOn = localStorage.getItem('weasel-sfx') !== '0'; } catch(e){}
function syncBtns(){
  musicBtn.textContent = musicOn ? 'Music on' : 'Music off'; musicBtn.setAttribute('aria-pressed', String(musicOn));
  sfxBtn.textContent = sfxOn ? 'Sounds on' : 'Sounds off'; sfxBtn.setAttribute('aria-pressed', String(sfxOn));
}
syncBtns();

// ---------- audio ----------
const SONGS = [
  { bpm:136, root:60, scale:[0,2,4,5,7,9,11], prog:[0,5,3,4], lead:'square',   leadVol:.055, leadCut:2600, arp:'triangle', drums:'pop',     seed:11 },
  { bpm:118, root:62, scale:[0,1,4,5,7,8,10], prog:[0,0,6,1], lead:'sawtooth', leadVol:.045, leadCut:1800, arp:'square',   drums:'shuffle', seed:23 },
  { bpm:110, root:57, scale:[0,2,3,5,7,9,10], prog:[0,6,5,3], lead:'triangle', leadVol:.10,  leadCut:5000, arp:'sine',     drums:'march',   seed:37 },
  { bpm:94,  root:52, scale:[0,2,3,5,7,8,10], prog:[0,5,2,6], lead:'sine',     leadVol:.10,  leadCut:5000, arp:'triangle', drums:'soft',    seed:41 },
];
let ac = null, master, musicBus, sfxBus, musicFilter, noiseBuf;
const seq = { song:0, pending:0, step:0, next:0, mel:[], playing:false };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function deg(s, d){ const n = s.scale.length, o = Math.floor(d / n); return s.root + s.scale[((d % n) + n) % n] + 12 * o; }

function genMelody(s){
  const r = mulberry(s.seed), out = new Array(128).fill(null), n = s.scale.length;
  const rhythms = [0,1,2].map(() => { const a = []; for (let i = 0; i < 16; i++){ const p = i % 4 === 0 ? .8 : i % 2 === 0 ? .45 : .18; a.push(r() < p); } a[0] = true; return a; });
  let cur = n + 2;
  const bars = [];
  for (let b = 0; b < 4; b++){
    const rh = rhythms[b === 3 ? 2 : b % 2], cd = s.prog[b], bar = [];
    for (let i = 0; i < 16; i++){
      if (!rh[i]){ bar.push(null); continue; }
      if (i % 4 === 0){
        const opts = [cd, cd+2, cd+4, cd+n, cd+n+2, cd+n+4].filter(x => x >= n - 2 && x <= 2 * n);
        opts.sort((a, c) => Math.abs(a - cur) - Math.abs(c - cur));
        cur = opts[r() < .7 || opts.length < 2 ? 0 : 1];
      } else {
        cur = clamp(cur + [-2,-1,-1,1,1,2][Math.floor(r() * 6)], n - 2, 2 * n);
      }
      bar.push(cur);
    }
    bars.push(bar);
  }
  const ending = bars[3].map((x, i) => x === null ? null : (i >= 12 ? s.prog[3] + n : x));
  const all = [bars[0], bars[1], bars[2], bars[3], bars[0], bars[1], bars[2], ending];
  all.forEach((bar, b) => bar.forEach((d, i) => {
    if (d === null) return;
    let len = 1; while (i + len < 16 && bar[i + len] === null && len < 4) len++;
    out[b * 16 + i] = { m:deg(s, d), len };
  }));
  return out;
}

function initAudio(){
  if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(ac.destination);
  master = ac.createGain(); master.gain.value = .85; master.connect(comp);
  musicFilter = ac.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000; musicFilter.connect(master);
  musicBus = ac.createGain(); musicBus.gain.value = musicOn ? .5 : 0; musicBus.connect(musicFilter);
  sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? .7 : 0; sfxBus.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  SONGS.forEach((s, i) => seq.mel[i] = genMelody(s));
  seq.next = ac.currentTime + .1;
  setInterval(schedule, 25);
}
function env(g, t, peak, dur){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function osc(type, freq, t, dur, vol, bus, f2, cut){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, vol, dur); o.connect(g);
  if (cut){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; g.connect(f); f.connect(bus); } else g.connect(bus);
  o.start(t); o.stop(t + dur + .03);
}
function noise(t, dur, vol, bus, type, freq){
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); env(g, t, vol, dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * .5); s.stop(t + dur + .03);
}
const kick = (t, v = 1) => osc('sine', 150, t, .18, .55 * v, musicBus, 42);
const snare = (t, v = 1) => { noise(t, .14, .22 * v, musicBus, 'highpass', 1500); osc('triangle', 220, t, .08, .08 * v, musicBus, 140); };
const hat = (t, v) => noise(t, .04, v, musicBus, 'highpass', 7500);

function tick(t, step){
  const s = SONGS[seq.song], bar = Math.floor(step / 16) % 8, i = step % 16, cd = s.prog[bar % 4], sd = 60 / s.bpm / 4;
  const dk = s.drums;
  if (dk === 'pop'){ if (i === 0 || i === 8 || i === 10) kick(t); if (i === 4 || i === 12) snare(t); if (i % 2 === 0) hat(t, .05); }
  else if (dk === 'shuffle'){ if (i === 0 || i === 7 || i === 10) kick(t); if (i === 4 || i === 12) snare(t, .7); if (i % 4 !== 1) hat(t, i % 4 === 3 ? .06 : .035); }
  else if (dk === 'march'){ if (i % 8 === 0) kick(t); if (i === 4 || i === 12) snare(t, .55); if (bar % 4 === 3 && i >= 13) snare(t, .3); hat(t, .022); }
  else { if (i === 0 || i === 10) kick(t, .55); if (i % 4 === 2) hat(t, .03); }
  if (i % 4 === 0 || i === 14){
    const n = i === 8 ? deg(s, cd + 4) - 24 : i === 14 ? deg(s, cd + 2) - 24 : deg(s, cd) - 24;
    osc(dk === 'soft' ? 'sine' : 'triangle', mtof(n), t, sd * (i === 14 ? 1.5 : 3), dk === 'soft' ? .32 : .28, musicBus);
  }
  if (i % 2 === 0){
    const tones = [0, 2, 4, 7];
    osc(s.arp, mtof(deg(s, cd + tones[(i / 2) % 4])), t, sd * 1.6, s.arp === 'square' ? .03 : .05, musicBus, null, 3500);
  }
  const m = seq.mel[seq.song] && seq.mel[seq.song][step % 128];
  if (m) osc(s.lead, mtof(m.m), t, sd * m.len * .95, s.leadVol, musicBus, null, s.leadCut);
}
function schedule(){
  if (!ac) return;
  if (!musicOn || ac.state !== 'running' || !seq.playing){ seq.next = ac.currentTime + .05; return; }
  if (seq.next < ac.currentTime) seq.next = ac.currentTime + .02;
  while (seq.next < ac.currentTime + .12){
    if (seq.step % 16 === 0 && seq.pending !== seq.song) seq.song = seq.pending;
    tick(seq.next, seq.step);
    seq.next += 60 / SONGS[seq.song].bpm / 4;
    seq.step = (seq.step + 1) % 128;
  }
}
const COMBO_STEPS = [0,2,4,5,7,9,11,12,14,16,17,19];
function sfx(name, x = 0){
  if (!ac || !sfxOn) return;
  const t = ac.currentTime, B = sfxBus;
  switch (name){
    case 'jump': osc('square', 330, t, .12, .11, B, 620, 3000); break;
    case 'double': osc('triangle', 520, t, .2, .18, B, 1250); noise(t, .2, .1, B, 'bandpass', 2600); break;
    case 'land': osc('sine', 140, t, .12, .3, B, 55); noise(t, .07, .08, B, 'lowpass', 800); break;
    case 'coin': { const f = 987.8 * Math.pow(2, x / 12); osc('square', f, t, .06, .08, B, null, 5000); osc('square', f * 1.335, t + .055, .13, .08, B, null, 5000); break; }
    case 'gem': [0,4,7,12,16].forEach((k, i) => osc('triangle', 880 * Math.pow(2, k / 12), t + i * .05, .16, .13, B)); break;
    case 'spring': osc('sine', 170, t, .4, .32, B, 900); osc('square', 340, t, .12, .05, B, 1400, 2000); break;
    case 'crumble': noise(t, .32, .25, B, 'lowpass', 600); break;
    case 'bonk': osc('square', 170, t, .1, .12, B, 90, 1200); break;
    case 'die': osc('square', 620, t, .6, .14, B, 80, 1800); noise(t, .3, .1, B, 'lowpass', 1000); break;
    case 'stomp': osc('square', 260, t, .09, .12, B, 520, 2500); osc('sine', 600, t + .06, .16, .14, B, 1100); break;
    case 'power': [0,4,7,12].forEach((k, i) => osc('square', 660 * Math.pow(2, k / 12), t + i * .06, .12, .06, B, null, 4000)); osc('sine', 330, t, .4, .12, B, 990); break;
    case 'pop': noise(t, .12, .2, B, 'highpass', 2000); osc('sine', 900, t, .1, .15, B, 300); break;
    case 'record': [0,4,7,12,7,12,16].forEach((k, i) => osc('square', 523 * Math.pow(2, k / 12), t + i * .07, .14, .07, B, null, 4000)); break;
    case 'biome': [0,7,12,19].forEach((k, i) => osc('triangle', 523 * Math.pow(2, k / 12), t + i * .08, .32, .12, B)); break;
  }
}

// ---------- world ----------
let segs = [], springs = [], coins = [], parts = [], popups = [], lines = [];
let P, speed, dist, got, camX, camY, refY, cursor;
let shake = 0, flash = 0, state = 'title', stateT = 0, combo = 0, lastCoinT = -9, curBiome = 0, time = 0, dustT = 0, blocked = false, panelShown = false;
let critters = [], bubbles = [], nextPowX = 0, nextCritX = 0, recordPassed = false, sparkT = 0, stomps = 0;
const pw = { magnet:0, frenzy:0, shield:false };
const POWERS = {
  magnet:{ name:'Magnet', col:'#E8453C', dur:9 },
  frenzy:{ name:'Coin frenzy', col:'#FFC83D', dur:8 },
  shield:{ name:'Bubble', col:'#7DD3FF', dur:0 },
};
let farthest = 0;
try { farthest = +localStorage.getItem('weasel-far') || 0; } catch(e){}

function makeDeco(s){
  const B = BIOMES[s.b], out = [], n = Math.floor(s.w / 80);
  for (let i = 0; i < n; i++) out.push({ x:rand(16, s.w - 16), k:B.deco[rint(0, B.deco.length - 1)], sc:rand(.8, 1.2), c:B.cols[rint(0, B.cols.length - 1)], h:Math.random() });
  out.sort((a, b) => a.x - b.x);
  return out;
}
function addGround(x, w, y, b){
  const s = { t:'g', x, w, y, b, ct:0, armed:false, falling:false, vy:0 }; s.deco = makeDeco(s); segs.push(s);
  if (x > nextCritX && w >= 230){
    nextCritX = x + rand(900, 2200) * (1 - .4 * Math.min(1, x / 40000));
    critters.push({ x:x + w * rand(.45, .75), y, seg:s, b, vx:-rand(30, 55), hop:Math.random() * 6, dead:null, t:0, vy:0, rot:0 });
  }
  if (x > nextPowX && w >= 180){
    nextPowX = x + rand(3200, 5200);
    const kinds = ['magnet', 'frenzy', 'shield'];
    bubbles.push({ x:x + w / 2, y:y - 95, kind:kinds[rint(0, 2)], seed:Math.random() * 6 });
  }
  return s;
}
function addLedge(x, w, y, b, cr){ const s = { t:'l', x, w, y, b, cr, ct:0, armed:false, falling:false, vy:0, deco:[] }; segs.push(s); return s; }
const coin = (x, y, gem) => ({ x, y, seed:Math.random() * 6, gem:!!gem });
const spAt = x => Math.min(MAXS, BASE + Math.max(0, x - 80) * ACC);
const nextY = (y, lo, up, down) => clamp(y + rand(-up, down), Math.max(lo, y - up), 320);

function reset(){
  segs = []; springs = []; coins = []; parts = []; popups = []; lines = []; critters = []; bubbles = [];
  nextCritX = 1400; nextPowX = 1800; recordPassed = false; stomps = 0;
  pw.magnet = 0; pw.frenzy = 0; pw.shield = false; powersKey = '';
  const s0 = addGround(-500, 1100, 280, 0);
  cursor = { x:600, y:280, seg:s0 };
  P = { x:80, y:280 - PH, vy:0, ground:true, coy:0, buf:0, canDouble:true, sq:0, spin:0, ang:0, phase:0 };
  speed = BASE; dist = 0; got = 0; combo = 0; lastCoinT = -9; refY = 280; curBiome = 0; blocked = false;
  camX = P.x - VW * .3; camY = refY - VH * .66; shake = 0; flash = 0;
  for (let i = 0; i < 5; i++) coins.push(coin(330 + i * 36, 280 - 26));
  while (cursor.x < camX + VW + 900) gen();
  hud(true);
}

function gen(){
  const sp = spAt(cursor.x), hard = Math.min(1, cursor.x / 45000), b = biomeIdx(cursor.x);
  const W = [[5,3,2,.6,1.2],[4,1.5,1.5,1,3],[3,3,2.2,2.5,1.2],[3,1.5,3,2,2]][b];
  [genPillar, genStairs, genLedges, genCrumble, genSpring][pick(W)](sp, hard);
}
function arcCoins(edge, y0, sp, dh, dbl){
  const x0 = edge - sp * .06, n = dbl ? 9 : 6, h1 = JV*JV/(2*G), t1 = JV/G;
  const T = (dbl ? t1 + (DJV + Math.sqrt(Math.max(0, DJV*DJV + 2*G*(h1 - dh)))) / G : airtime(JV, dh)) * .82;
  for (let i = 0; i < n; i++){
    const t = T * (i + .6) / n;
    let up; if (!dbl || t < t1) up = JV*t - .5*G*t*t; else { const u = t - t1; up = h1 + DJV*u - .5*G*u*u; }
    coins.push(coin(x0 + sp * t + PW / 2, y0 - PH * .5 - up));
  }
}
function rowCoins(s){
  if (Math.random() < .25) return;
  const n = clamp(Math.floor((s.w - 80) / 36), 2, 6), st = s.x + (s.w - (n - 1) * 36) / 2, arch = Math.random() < .35;
  for (let i = 0; i < n; i++) coins.push(coin(st + i * 36, s.y - 26 - (arch ? Math.sin(i / (n - 1) * Math.PI) * 34 : 0)));
}
function bonus(s){
  if (s.w > 240 && Math.random() < .22){ for (let i = 0; i < 3; i++) coins.push(coin(s.x + s.w / 2 + (i - 1) * 30, s.y - 165 + Math.abs(i - 1) * 10)); }
  else if (Math.random() < .06) coins.push(coin(s.x + s.w / 2, s.y - 190, true));
}
function genPillar(sp, hard){
  const c = cursor, ny = nextY(c.y, 190, 85, 85), dh = c.y - ny;
  const wide = Math.random() < .1 + .15 * hard;
  const mx = wide ? reach2(sp, dh) * .6 : reach1(sp, dh) * (.42 + .28 * hard);
  const gap = Math.max(60, wide ? rand(mx * .8, mx) : rand(70, Math.max(80, mx)));
  const w = Math.max(150, rand(220, 480) * (1 - .4 * hard));
  const x = c.x + gap, s = addGround(x, w, ny, segBiome(x));
  if (wide) arcCoins(c.x, c.y, sp, dh, true);
  else if (gap > 90 && Math.random() < .6) arcCoins(c.x, c.y, sp, dh, false);
  else rowCoins(s);
  bonus(s);
  cursor = { x:x + w, y:ny, seg:s };
}
function genStairs(sp){
  const n = rint(2, 4), c = cursor;
  let x = c.x + (Math.random() < .5 ? 0 : rand(60, Math.max(70, reach1(sp, 0) * .4))), y = c.y;
  for (let i = 0; i < n; i++){
    const ny = nextY(y, 190, 60, 60), w = rand(120, 200), s = addGround(x, w, ny, segBiome(x));
    if (Math.random() < .5) coins.push(coin(x + w / 2, ny - 26));
    x += w; y = ny; cursor = { x, y, seg:s };
  }
}
function genLedges(sp, hard, cr){
  const n = rint(2, 3 + (hard > .5 ? 1 : 0));
  let c = cursor;
  for (let i = 0; i < n; i++){
    const ny = nextY(c.y, 175, 80, 60), dh = c.y - ny;
    const gap = Math.max(70, rand(.35, cr ? .5 : .6) * reach1(sp, dh));
    const w = cr ? rand(90, 120) : rand(100, 170), x = c.x + gap;
    const s = addLedge(x, w, ny, segBiome(x), !!cr);
    if (Math.random() < .55) arcCoins(c.x, c.y, sp, dh, false);
    else for (let k = 0; k < 2; k++) coins.push(coin(x + w * (k + 1) / 3, ny - 26));
    cursor = c = { x:x + w, y:ny, seg:s };
  }
  genPillar(sp, hard);
}
function genCrumble(sp, hard){ genLedges(sp, hard, true); }
function genSpring(sp, hard){
  const c = cursor;
  if (c.seg.t !== 'g' || c.seg.w < 170){ genPillar(sp, hard); return; }
  const sx = c.x - 80; springs.push({ x:sx, y:c.y, w:40, comp:0 });
  const ny = clamp(c.y - rand(-30, 140), 170, 320), dh = c.y - ny;
  const t = airtime(SPRING, dh), rch = sp * t;
  const launchX = sx + 20 - PW / 2, edgeDist = c.x - launchX;
  const gap = Math.max(140, rand(.45, .62) * rch - edgeDist);
  const x = c.x + gap, w = Math.max(rand(260, 420), launchX + rch - x + 160);
  const s = addGround(x, w, ny, segBiome(x));
  for (let i = 0; i < 10; i++){ const tt = t * .8 * (i + .7) / 10; coins.push(coin(launchX + PW / 2 + sp * tt, c.y - PH * .5 - (SPRING * tt - .5 * G * tt * tt))); }
  if (Math.random() < .4) coins.push(coin(launchX + PW / 2 + sp * SPRING / G, c.y - PH * .5 - SPRING * SPRING / (2 * G) - 30, true));
  cursor = { x:x + w, y:ny, seg:s };
}

// ---------- input ----------
function jump(){
  P.vy = -JV; P.ground = false; P.coy = 0; P.buf = 0; P.sq = .3;
  sfx('jump'); dustBurst(P.x + PW / 2, P.y + PH, 6, .6);
}
function doubleJump(){
  P.vy = -DJV; P.canDouble = false; P.spin = 1; P.sq = .25;
  sfx('double');
  parts.push({ k:'ring', x:P.x + PW / 2, y:P.y + PH - 4, life:.35, max:.35, r:6, R:34, col:'#FFFFFF' });
  for (let i = 0; i < 8; i++){ const a = i / 8 * TAU; parts.push({ k:'puff', x:P.x + PW / 2, y:P.y + PH, vx:Math.cos(a) * 130, vy:Math.sin(a) * 60 + 40, life:.35, max:.35, r:5, col:'#FFFFFF' }); }
}
// seconds until the weasel lands on something solid at its current arc, or Infinity
function timeToLand(){
  if (P.vy < -60) return Infinity;
  let t0 = Infinity;
  for (const s of segs){
    if (s.falling || (s.ct > 0 && s.ct < .15)) continue;
    const d = s.y - (P.y + PH); if (d < -1) continue;
    const t = (-P.vy + Math.sqrt(Math.max(0, P.vy * P.vy + 2 * G * Math.max(0, d)))) / G;
    const x = P.x + speed * t;
    if (x + PW > s.x + 2 && x < s.x + s.w - 2 && t < t0) t0 = t;
  }
  return t0;
}
const LAND_GRACE = .16;
function press(){
  initAudio();
  if (state === 'title'){ start(); return; }
  if (state === 'dead'){ if (stateT > .7) start(); return; }
  if (P.ground || P.coy > 0) jump();
  else if (timeToLand() < LAND_GRACE) P.buf = LAND_GRACE + .04;   // nearly landed: save the tap as a normal jump
  else if (P.canDouble) doubleJump();
  else P.buf = .14;
}
function start(){
  reset(); state = 'play'; stateT = 0; panelShown = false;
  overlay.classList.add('hidden');
  seq.pending = 0; seq.playing = true;
  if (ac) musicFilter.frequency.setTargetAtTime(18000, ac.currentTime, .2);
  showBanner(BIOMES[0].name);
}
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.btn')) return;
  e.preventDefault(); press();
}, { passive:false });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || (e.code === 'Enter' && !e.target.closest('.btn'))){ e.preventDefault(); press(); }
});
musicBtn.addEventListener('click', () => {
  initAudio(); musicOn = !musicOn; syncBtns();
  if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? .5 : 0, ac.currentTime, .05);
  try { localStorage.setItem('weasel-music', musicOn ? '1' : '0'); } catch(e){}
  musicBtn.blur();
});
sfxBtn.addEventListener('click', () => {
  initAudio(); sfxOn = !sfxOn; syncBtns();
  if (sfxBus) sfxBus.gain.setTargetAtTime(sfxOn ? .7 : 0, ac.currentTime, .05);
  try { localStorage.setItem('weasel-sfx', sfxOn ? '1' : '0'); } catch(e){}
  sfxBtn.blur();
});
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});

// ---------- juice helpers ----------
function dustBurst(x, y, n, power){
  const col = BIOMES[biomeIdx(x)].dust;
  for (let i = 0; i < n; i++) parts.push({ k:'puff', x:x + rand(-8, 8), y, vx:rand(-90, 90) * power, vy:-rand(20, 70) * power, life:rand(.3, .5), max:.5, r:rand(3, 6), col });
}
function showBanner(name){ banner.textContent = name; banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show'); }
let hudKey = '';
function hud(force){
  const m = Math.floor(dist / UPM), k = got + '|' + m;
  if (k !== hudKey || force){ hudKey = k; elCoins.textContent = got; elDist.textContent = m + ' m'; }
  const show = state === 'play' && combo >= 3 && time - lastCoinT < .7;
  elCombo.classList.toggle('on', show);
  if (show) elCombo.textContent = 'x' + combo + ' combo';
  // power-up pills
  const list = [];
  if (pw.magnet > 0) list.push(['magnet', pw.magnet]);
  if (pw.frenzy > 0) list.push(['frenzy', pw.frenzy]);
  if (pw.shield) list.push(['shield', -1]);
  const key = list.map(([k, t]) => k + (t < 0 ? '' : Math.ceil(t * 10))).join('|');
  if (key !== powersKey){
    powersKey = key;
    elPowers.innerHTML = list.map(([k, t]) => {
      const P0 = POWERS[k], bar = t < 0 ? '' : `<span class="bar"><b style="width:${Math.round(t / P0.dur * 100)}%;background:${P0.col}"></b></span>`;
      return `<span class="pill${t >= 0 && t < 1.5 ? ' ending' : ''}"><i style="background:${P0.col}"></i>${P0.name}${bar}</span>`;
    }).join('');
  }
}
let powersKey = '';
const elPowers = $('powers');
function popCoin(){ elCoinsBox.classList.remove('pop'); void elCoinsBox.offsetWidth; elCoinsBox.classList.add('pop'); }
function collect(c){
  combo = time - lastCoinT < .7 ? combo + 1 : 1; lastCoinT = time;
  const val = (c.gem ? 5 : 1) * (pw.frenzy > 0 ? 2 : 1);
  got += val;
  if (c.gem){ sfx('gem'); shake = Math.max(shake, 4); flash = .25; }
  else sfx('coin', COMBO_STEPS[Math.min(combo - 1, 11)]);
  popups.push({ x:c.x, y:c.y - 12, txt:'+' + val, life:.7, max:.7, big:c.gem || val > 1 });
  for (let k = 0; k < (c.gem ? 16 : 8); k++){
    const a = rand(0, TAU), v = rand(60, 180);
    parts.push({ k:'star', x:c.x, y:c.y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 40, life:rand(.3, .5), max:.5, r:rand(2.5, 4.5), col:c.gem ? '#7DE3FF' : (k % 2 ? '#FFF1B8' : '#FFC83D') });
  }
  parts.push({ k:'ring', x:c.x, y:c.y, life:.3, max:.3, r:6, R:22, col:'#FFE58A' });
  if (combo >= 5 && combo % 5 === 0) popups.push({ x:c.x, y:c.y - 40, txt:combo + ' combo!', life:1.1, max:1.1, big:true });
  hud(); popCoin();
}

// ---------- update ----------
function update(dt){
  speed = Math.min(MAXS, BASE + dist * ACC);
  P.buf -= dt; P.coy -= dt;
  if (P.buf > 0 && P.ground) jump();

  // horizontal, blocked by walls of taller ground
  let nx = P.x + speed * dt, hit = false;
  for (const s of segs){
    if (s.t !== 'g' || s.falling || s.x > nx + PW + 4 || s.x + s.w < P.x) continue;
    if (P.y + PH > s.y + 1 && P.x + PW <= s.x + .5 && nx + PW > s.x){ nx = s.x - PW; hit = true; }
  }
  if (hit && !blocked){ sfx('bonk'); P.sq = -.12; shake = Math.max(shake, 3); }
  blocked = hit;
  dist += Math.max(0, nx - P.x); P.x = nx;

  // vertical
  const prevVy = P.vy;
  P.vy = Math.min(P.vy + G * dt, 1400);
  let ny = P.y + P.vy * dt;
  const was = P.ground; P.ground = false; let landed = null;
  for (const s of segs){
    if (s.falling || P.x + PW <= s.x + 2 || P.x >= s.x + s.w - 2) continue;
    if (P.vy >= 0 && P.y + PH <= s.y + 1 && ny + PH >= s.y){ ny = s.y - PH; P.vy = 0; P.ground = true; landed = s; }
  }
  P.y = ny;
  if (P.ground){
    refY = landed.y; P.canDouble = true; P.spin = 0;
    if (landed.t === 'l' && landed.cr && !landed.armed){ landed.armed = true; landed.ct = .42; }
    if (!was){
      const imp = clamp(prevVy / 1200, 0, 1);
      P.sq = -.12 - .3 * imp;
      dustBurst(P.x + PW / 2, P.y + PH, 4 + Math.round(imp * 10), .5 + imp);
      if (prevVy > 950){ shake = Math.max(shake, 4 + imp * 6); sfx('land'); }
      if (P.x + PW - landed.x < 13 && prevVy > 150) popups.push({ x:P.x + PW / 2, y:P.y - 18, txt:'Phew!', life:.9, max:.9, big:false });
    }
  }
  if (was && !P.ground && P.vy >= 0) P.coy = .12;

  // sparkle trail while the double jump is still banked
  if (!P.ground && P.canDouble){
    sparkT -= dt;
    if (sparkT <= 0){ sparkT = .045; parts.push({ k:'star', x:P.x + rand(-4, 8), y:P.y + PH * rand(.3, .9), vx:-rand(20, 60), vy:rand(-20, 20), life:.35, max:.35, r:rand(1.8, 3), col:Math.random() < .5 ? '#FFF1B8' : '#FFC83D' }); }
  }

  // springs
  for (const sp of springs){
    if (P.ground && Math.abs(P.x + PW / 2 - (sp.x + sp.w / 2)) < sp.w / 2 + 4 && Math.abs(P.y + PH - sp.y) < 2){
      P.vy = -SPRING; P.ground = false; P.canDouble = true; P.sq = .4; sp.comp = 1;
      shake = Math.max(shake, 6); sfx('spring'); dustBurst(sp.x + sp.w / 2, sp.y, 10, 1);
      parts.push({ k:'ring', x:sp.x + sp.w / 2, y:sp.y - 10, life:.4, max:.4, r:8, R:40, col:'#FF8A80' });
    }
  }

  // running dust + motion
  if (P.ground){
    P.phase += speed * dt * .05;
    dustT -= dt;
    if (dustT <= 0){ dustT = .09; parts.push({ k:'puff', x:P.x + 2, y:P.y + PH - 2, vx:-rand(20, 60), vy:-rand(10, 40), life:.35, max:.35, r:rand(3, 5), col:BIOMES[biomeIdx(P.x)].dust }); }
  }
  if (P.spin > 0) P.spin = Math.max(0, P.spin - dt / .42);
  P.sq += (0 - P.sq) * Math.min(1, dt * 10);

  // crumbling ledges
  for (const s of segs){
    if (s.ct > 0){
      s.ct -= dt;
      if (s.ct <= 0){
        s.ct = 0; s.falling = true; sfx('crumble');
        for (let i = 0; i < 10; i++) parts.push({ k:'chunk', x:s.x + rand(0, s.w), y:s.y + rand(0, 18), vx:rand(-40, 40), vy:rand(-80, 20), life:1, max:1, r:rand(3, 6), col:BIOMES[s.b].body, line:BIOMES[s.b].line, rot:rand(0, TAU), vr:rand(-8, 8) });
      }
    }
    if (s.falling){ s.vy += G * .7 * dt; s.y += s.vy * dt; }
  }

  // coins (pulled in by the magnet)
  const cx = P.x + PW / 2, cy = P.y + PH / 2;
  for (let i = coins.length - 1; i >= 0; i--){
    const c = coins[i];
    if (pw.magnet > 0){
      const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy);
      if (d < 170 || c.pulled){ c.pulled = true; const v = (700 + speed) * dt / Math.max(1, d); c.x += dx * Math.min(1, v); c.y += dy * Math.min(1, v); }
    }
    if (Math.abs(c.x - cx) < PW / 2 + 11 && Math.abs(c.y - cy) < PH / 2 + 11){ coins.splice(i, 1); collect(c); }
  }

  // power-up timers and bubbles
  if (pw.magnet > 0) pw.magnet = Math.max(0, pw.magnet - dt);
  if (pw.frenzy > 0) pw.frenzy = Math.max(0, pw.frenzy - dt);
  for (let i = bubbles.length - 1; i >= 0; i--){
    const b = bubbles[i], by = b.y + Math.sin(time * 2.5 + b.seed) * 6;
    if (Math.abs(b.x - cx) < PW / 2 + 20 && Math.abs(by - cy) < PH / 2 + 20){ bubbles.splice(i, 1); grabPower(b, by); }
  }

  // critters
  for (const c of critters){
    c.t += dt;
    if (c.dead === 'bowl'){ c.vy += G * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += dt * 14; continue; }
    if (c.dead === 'squash') continue;
    c.x += c.vx * dt;
    if (c.x < c.seg.x + 14 || c.x > c.seg.x + c.seg.w - 14){ c.vx = -c.vx; c.x = clamp(c.x, c.seg.x + 14, c.seg.x + c.seg.w - 14); }
    c.hop += dt * 9;
    const top = c.y - 22, left = c.x - 15, right = c.x + 15;
    if (P.x + PW > left && P.x < right && P.y + PH > top && P.y < c.y){
      if (P.vy > 0 && P.y + PH - top < 20) stomp(c);
      else bowl(c);
    }
  }

  // stream world
  while (cursor.x < camX + VW + 900) gen();
  segs = segs.filter(s => s.x + s.w > camX - 200 && s.y < camY + VH + 600);
  coins = coins.filter(c => c.x > camX - 60);
  springs = springs.filter(p => p.x > camX - 100);
  critters = critters.filter(c => c.x > camX - 80 && c.y < camY + VH + 200 && !(c.dead === 'squash' && c.t > .6));
  bubbles = bubbles.filter(b => b.x > camX - 60);

  // passing your farthest run
  if (!recordPassed && farthest > 600 && dist > farthest){
    recordPassed = true; sfx('record'); flash = .2;
    popups.push({ x:P.x + 40, y:P.y - 50, txt:'New record!', life:1.4, max:1.4, big:true });
    confetti(P.x + 60, P.y - 20, 40);
  }

  // camera
  camX = P.x - VW * .3;
  let ty = refY - VH * .66; if (P.y - ty < 70) ty = P.y - 70;
  camY += (ty - camY) * Math.min(1, dt * 5);

  const bi = biomeIdx(P.x);
  if (bi !== curBiome){ curBiome = bi; showBanner(BIOMES[bi].name); sfx('biome'); seq.pending = bi; }

  // the bubble saves you from one fall
  if (pw.shield && P.vy > 0 && P.y > refY + 120){
    pw.shield = false; P.vy = -1300; P.canDouble = true; P.spin = 1;
    sfx('pop'); sfx('spring'); shake = 8; flash = .3;
    parts.push({ k:'ring', x:cx, y:P.y + PH / 2, life:.5, max:.5, r:20, R:60, col:'#BDEBFF' });
    for (let i = 0; i < 14; i++){ const a = i / 14 * TAU; parts.push({ k:'puff', x:cx + Math.cos(a) * 24, y:P.y + PH / 2 + Math.sin(a) * 28, vx:Math.cos(a) * 160, vy:Math.sin(a) * 160, life:.4, max:.4, r:4, col:'#DDF4FF' }); }
    popups.push({ x:cx, y:P.y - 20, txt:'Saved!', life:1, max:1, big:true });
  }

  if (P.y - camY > VH + 60) die();
  hud();
}

function grabPower(b, by){
  const k = b.kind;
  if (k === 'shield') pw.shield = true; else pw[k] = POWERS[k].dur;
  sfx('power'); flash = .15; shake = Math.max(shake, 3);
  popups.push({ x:b.x, y:by - 26, txt:POWERS[k].name + '!', life:1.2, max:1.2, big:true });
  parts.push({ k:'ring', x:b.x, y:by, life:.4, max:.4, r:16, R:40, col:POWERS[k].col });
  for (let i = 0; i < 12; i++){ const a = rand(0, TAU), v = rand(80, 200); parts.push({ k:'star', x:b.x, y:by, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:.5, max:.5, r:rand(2.5, 4.5), col:i % 2 ? '#FFFFFF' : POWERS[k].col }); }
}
function stomp(c){
  c.dead = 'squash'; c.t = 0; stomps++;
  P.vy = -JV * .95; P.canDouble = true; P.sq = .35; P.ground = false;
  combo = time - lastCoinT < .9 ? combo + 1 : 1; lastCoinT = time;
  const val = 3 * (pw.frenzy > 0 ? 2 : 1); got += val;
  sfx('stomp'); shake = Math.max(shake, 5); popCoin(); hud();
  popups.push({ x:c.x, y:c.y - 34, txt:'Bop! +' + val, life:.9, max:.9, big:true });
  parts.push({ k:'ring', x:c.x, y:c.y - 8, life:.3, max:.3, r:8, R:30, col:'#FFFFFF' });
  for (let i = 0; i < 8; i++){ const a = rand(Math.PI, TAU), v = rand(80, 180); parts.push({ k:'star', x:c.x, y:c.y - 10, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:.4, max:.4, r:rand(2.5, 4), col:'#FFF1B8' }); }
}
function bowl(c){
  c.dead = 'bowl'; c.vx = speed + 160; c.vy = -520; c.t = 0;
  sfx('bonk'); shake = Math.max(shake, 3);
  popups.push({ x:c.x, y:c.y - 30, txt:'Bonk', life:.6, max:.6, big:false });
}
function confetti(x, y, n){
  const cols = ['#FF6FA8', '#FFC83D', '#7DE3FF', '#8CE07A', '#B48CFF', '#FFFFFF'];
  for (let i = 0; i < n; i++) parts.push({ k:'chunk', x, y, vx:rand(-260, 260), vy:rand(-520, -120), life:rand(.9, 1.4), max:1.4, r:rand(2, 3.5), col:cols[i % cols.length], line:'rgba(0,0,0,0)', rot:rand(0, TAU), vr:rand(-12, 12) });
}

function die(){
  state = 'dead'; stateT = 0; shake = 10; flash = .35; P.vy = -900; P.ang = 0;
  sfx('die');
  if (ac) musicFilter.frequency.setTargetAtTime(500, ac.currentTime, .1);
  const m = Math.floor(dist / UPM);
  const nb = got > best.coins || (got === best.coins && m > best.dist);
  if (nb){ best = { coins:got, dist:m }; try { localStorage.setItem('weasel-best', JSON.stringify(best)); } catch(e){} }
  const far = dist > farthest;
  if (far){ farthest = dist; try { localStorage.setItem('weasel-far', String(Math.round(dist))); } catch(e){} }
  pw.magnet = 0; pw.frenzy = 0; pw.shield = false;
  die.info = { m, nb, far };
  hud();
}
function showDeath(){
  panelShown = true;
  const { m, nb } = die.info;
  const titles = ['Whoops!', 'Weasel down!', 'So close!', 'Gap got you!'];
  const plural = n => n === 1 ? 'coin' : 'coins';
  panel.innerHTML = `
    <h1>${nb && got > 0 ? 'New best!' : titles[rint(0, titles.length - 1)]}</h1>
    <p>${got} ${plural(got)} in ${m} m</p>
    ${stomps ? `<p>Critters bopped: ${stomps}</p>` : ''}
    <p>Best: ${best.coins} ${plural(best.coins)} in ${best.dist} m</p>
    <p>Farthest ever: ${Math.floor(farthest / UPM)} m${die.info.far && m > 0 ? ' (this run!)' : ''}</p>
    <div class="go">Tap to run again</div>`;
  overlay.classList.remove('hidden');
}

let ambT = 0;
function ambient(dt){
  ambT -= dt; if (ambT > 0) return; ambT = .12;
  const b = biomeIdx(camX + VW * .5), x = camX + rand(0, VW + 200), y = camY + rand(-20, VH);
  if (b === 0) parts.push({ k:'petal', x:camX + VW + 20, y:camY + rand(0, VH * .7), vx:-rand(40, 100), vy:rand(10, 30), life:8, max:8, r:rand(2.5, 4), col:Math.random() < .5 ? '#FFC1D9' : '#FFFFFF', rot:rand(0, TAU) });
  else if (b === 1){ if (Math.random() < .6) parts.push({ k:'sand', x:camX + VW + 20, y:camY + rand(VH * .3, VH), vx:-rand(300, 500), vy:rand(-10, 10), life:3, max:3, r:rand(10, 30), col:'#FFE7B0' }); }
  else if (b === 2) parts.push({ k:'snow', x, y:camY - 10, vx:-rand(20, 60), vy:rand(40, 80), life:8, max:8, r:rand(1.5, 3.2), col:'#FFFFFF' });
  else parts.push({ k:'fly', x, y, vx:rand(-20, 20), vy:rand(-15, 15), life:5, max:5, r:rand(1.5, 2.5), col:'#C9FF8A', rot:rand(0, TAU) });
}

// ---------- background ----------
function tiles(size, off, fn){ const k0 = Math.floor(off / size) - 2, k1 = Math.floor((off + VW) / size) + 2; for (let k = k0; k <= k1; k++) fn(k, k * size - off); }
const camNeutral = () => 280 - VH * .66;
function hillBand(base, off, col, freq, amp){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-10, VH + 10);
  for (let sx = -10; sx <= VW + 10; sx += 8){ const wx = sx + off; ctx.lineTo(sx, base - amp * (Math.sin(wx * freq) + .5 * Math.sin(wx * freq * 2.3 + 1))); }
  ctx.lineTo(VW + 10, VH + 10); ctx.closePath(); ctx.fill();
}
function drawSky(bb){
  const A = BIOMES[bb.i], Bb = BIOMES[bb.j], t = bb.t;
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, mix(A.skyTop, Bb.skyTop, t)); g.addColorStop(1, mix(A.skyBot, Bb.skyBot, t));
  ctx.fillStyle = g; ctx.fillRect(-20, -20, VW + 40, VH + 40);
  const w = [0,0,0,0]; w[bb.i] += 1 - t; w[bb.j] += t;
  if (w[3] > 0) drawNight(w[3]);
  if (w[1] > 0) drawSun(w[1]);
  if (w[0] + w[2] > 0) drawClouds(w[0] + w[2] * .7);
}
function drawSun(a){
  const x = VW * .72, y = VH * .3 - (camY - camNeutral()) * .03;
  ctx.globalAlpha = a * .25; ctx.fillStyle = '#FFF4C8'; ctx.beginPath(); ctx.arc(x, y, 64 + Math.sin(time * 2) * 3, 0, TAU); ctx.fill();
  ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, 44, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawNight(a){
  ctx.globalAlpha = a;
  for (let i = 0; i < 70; i++){
    const sx = hash(i) * VW, sy = hash(i + 99) * VH * .55, tw = .5 + .5 * Math.sin(time * 3 + i);
    ctx.fillStyle = `rgba(255,250,230,${.4 + .6 * tw})`; ctx.fillRect(sx, sy, hash(i + 5) > .8 ? 2.5 : 1.5, hash(i + 5) > .8 ? 2.5 : 1.5);
  }
  const mx = VW * .78, my = VH * .2;
  ctx.fillStyle = 'rgba(240,230,255,.18)'; ctx.beginPath(); ctx.arc(mx, my, 50, 0, TAU); ctx.fill();
  ctx.fillStyle = '#F3EEFF'; ctx.beginPath(); ctx.arc(mx, my, 26, 0, TAU); ctx.fill();
  ctx.fillStyle = '#D9D0F0';
  [[-8,-6,5],[7,4,4],[-3,10,3]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, TAU); ctx.fill(); });
  ctx.globalAlpha = 1;
}
function drawClouds(a){
  ctx.globalAlpha = Math.min(1, a) * .95;
  const off = camX * .05 + time * 10, dy = (camY - camNeutral()) * .05;
  tiles(260, off, (k, x) => {
    if (hash(k) < .4) return;
    const cx = x + hash(k + 1) * 100, cy = 40 + hash(k + 2) * VH * .25 - dy, s = .7 + hash(k + 3) * .6;
    ctx.fillStyle = '#DCEBFA';
    ctx.beginPath(); ctx.ellipse(cx, cy + 6 * s, 50 * s, 12 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    [[-28,0,18],[-8,-10,24],[18,-4,20],[36,2,14]].forEach(([ox, oy, r]) => { ctx.beginPath(); ctx.arc(cx + ox * s, cy + oy * s, r * s, 0, TAU); ctx.fill(); });
  });
  ctx.globalAlpha = 1;
}
function drawLayer(fn, bb){
  if (bb.t < 1) fn(bb.i);
  if (bb.t > 0){ ctx.save(); ctx.globalAlpha = bb.t; fn(bb.j); ctx.restore(); }
}
function drawFar(b){
  const B = BIOMES[b], f = .12, off = camX * f, base = VH * .66 + 40 - (camY - camNeutral()) * f;
  ctx.lineJoin = 'round';
  if (b === 0){
    tiles(210, off, (k, x) => {
      if (hash(k) < .45) return;
      const tx = x + hash(k + 1) * 70, tw = 44 + hash(k + 2) * 36, th = 90 + hash(k + 3) * 100;
      if (hash(k + 5) > .5){
        const ww = 90, wh = th * .45;
        ctx.fillStyle = B.far; ctx.fillRect(tx + tw - 2, base - wh, ww, wh);
        ctx.fillStyle = B.farDark; ctx.beginPath(); ctx.moveTo(tx + tw + 20, base); ctx.lineTo(tx + tw + 20, base - wh * .45); ctx.arc(tx + tw + 43, base - wh * .45, 23, Math.PI, 0); ctx.lineTo(tx + tw + 66, base); ctx.fill();
      }
      ctx.fillStyle = B.far; ctx.fillRect(tx, base - th, tw, th);
      const m = tw / 7;
      for (const i of [0, 2, 4, 6]) ctx.fillRect(tx + i * m, base - th - m * 1.2, m, m * 1.2 + 1);
      ctx.fillStyle = '#8CB88A'; ctx.fillRect(tx - 3, base - th - 2, tw + 6, 6);
      ctx.fillStyle = B.farDark; ctx.beginPath(); const wx = tx + tw * .38, ww2 = tw * .24, wy = base - th * .62;
      ctx.rect(wx, wy, ww2, th * .16); ctx.arc(wx + ww2 / 2, wy, ww2 / 2, Math.PI, 0); ctx.fill();
    });
    hillBand(base, off, '#A9C7A2', .008, 12);
  } else if (b === 1){
    tiles(280, off, (k, x) => {
      if (hash(k) < .35) return;
      const tx = x + hash(k + 1) * 60, tw = 120 + hash(k + 2) * 160, th = 60 + hash(k + 3) * 90;
      ctx.fillStyle = B.far; ctx.beginPath(); ctx.moveTo(tx, base); ctx.lineTo(tx + 16, base - th); ctx.lineTo(tx + tw - 16, base - th); ctx.lineTo(tx + tw, base); ctx.fill();
      ctx.fillStyle = B.farDark;
      for (const fr of [.35, .65]){ const yy = base - th * fr; const inset = 16 * fr; ctx.fillRect(tx + inset, yy, tw - inset * 2, 6); }
    });
    hillBand(base, off, '#E7A96F', .006, 10);
  } else if (b === 2){
    tiles(180, off, (k, x) => {
      const tx = x + hash(k + 1) * 60, tw = 220 + hash(k + 2) * 140, th = 130 + hash(k + 3) * 120, ax = tx + tw * (.4 + hash(k + 4) * .2);
      ctx.fillStyle = B.far; ctx.beginPath(); ctx.moveTo(tx, base); ctx.lineTo(ax, base - th); ctx.lineTo(tx + tw, base); ctx.fill();
      ctx.fillStyle = B.farDark; ctx.beginPath(); ctx.moveTo(ax, base - th); ctx.lineTo(tx + tw, base); ctx.lineTo(ax + tw * .08, base); ctx.fill();
      const c = .3;
      ctx.fillStyle = '#F4F8FC'; ctx.beginPath(); ctx.moveTo(ax, base - th);
      const lx = ax + (tx - ax) * c, rx = ax + (tx + tw - ax) * c, yy = base - th + th * c;
      ctx.lineTo(rx, yy);
      for (let i = 1; i < 6; i++){ const px = rx + (lx - rx) * i / 6; ctx.lineTo(px, yy + (i % 2 ? 8 : -2)); }
      ctx.lineTo(lx, yy); ctx.closePath(); ctx.fill();
    });
    hillBand(base, off, '#B7C8DD', .007, 10);
  } else {
    tiles(60, off, (k, x) => {
      const th = 110 + hash(k) * 90, tx = x + hash(k + 1) * 30;
      ctx.fillStyle = B.far; ctx.fillRect(tx + 24, base - th, 10, th);
      [[29,-th,26],[12,-th+18,20],[46,-th+16,20]].forEach(([ox, oy, r]) => { ctx.beginPath(); ctx.arc(tx + ox, base + oy, r, 0, TAU); ctx.fill(); });
    });
    hillBand(base, off, B.farDark, .009, 10);
  }
}
function drawMid(b){
  const B = BIOMES[b], f = .35, off = camX * f, base = VH * .66 + 80 - (camY - camNeutral()) * f;
  const hy = wx => base - (18 * Math.sin(wx * .006) + 10 * Math.sin(wx * .017 + 2) + 6 * Math.sin(wx * .031));
  if (b === 2){
    ctx.fillStyle = B.midDark;
    tiles(26, off, (k, x) => {
      if (hash(k) < .2) return;
      const px = x + hash(k + 1) * 10, gy = hy(px + off) + 6, h = 30 + hash(k + 2) * 30;
      ctx.beginPath(); ctx.moveTo(px - 11, gy); ctx.lineTo(px, gy - h); ctx.lineTo(px + 11, gy); ctx.fill();
    });
  }
  ctx.fillStyle = B.mid; ctx.beginPath(); ctx.moveTo(-10, VH + 10);
  for (let sx = -10; sx <= VW + 10; sx += 6) ctx.lineTo(sx, hy(sx + off));
  ctx.lineTo(VW + 10, VH + 10); ctx.closePath(); ctx.fill();
  if (b === 0){
    ctx.fillStyle = B.midDark;
    tiles(90, off, (k, x) => { if (hash(k) < .45) return; const px = x + hash(k + 1) * 40, gy = hy(px + off) + 4, s = .7 + hash(k + 2) * .6;
      [[-10,0,9],[0,-6,12],[11,0,9]].forEach(([ox, oy, r]) => { ctx.beginPath(); ctx.arc(px + ox * s, gy + oy * s, r * s, 0, TAU); ctx.fill(); }); });
  } else if (b === 1){
    ctx.fillStyle = B.midDark;
    tiles(160, off, (k, x) => { if (hash(k) < .6) return; const px = x + hash(k + 1) * 60, gy = hy(px + off) + 4;
      ctx.fillRect(px - 3, gy - 26, 6, 26); ctx.fillRect(px - 11, gy - 18, 4, 10); ctx.fillRect(px - 11, gy - 10, 10, 4); ctx.fillRect(px + 7, gy - 22, 4, 10); ctx.fillRect(px + 2, gy - 14, 9, 4); });
  } else if (b === 2){
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    tiles(140, off, (k, x) => { if (hash(k) < .5) return; const px = x + hash(k + 1) * 60; ctx.beginPath(); ctx.ellipse(px, hy(px + off) + 6, 30, 5, 0, 0, TAU); ctx.fill(); });
  } else {
    tiles(70, off, (k, x) => { if (hash(k) < .5) return; const px = x + hash(k + 1) * 40, gy = hy(px + off) + 4, g = .5 + .5 * Math.sin(time * 2 + k);
      ctx.fillStyle = `rgba(155,245,210,${.15 + .2 * g})`; ctx.beginPath(); ctx.arc(px, gy - 6, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#9BF5D2'; ctx.beginPath(); ctx.arc(px, gy - 6, 4, Math.PI, 0); ctx.fill(); ctx.fillRect(px - 1, gy - 6, 2, 6); });
  }
}

// ---------- terrain ----------
function capWave(b, wx){
  if (b === 0) return 3 * Math.sin(wx * .3) + 2 * Math.sin(wx * .11);
  if (b === 1) return 2 * Math.sin(wx * .05);
  if (b === 2){ const k = Math.floor(wx / 14), f = wx / 14 - k; return 2 + (hash(k) > .55 ? 9 * Math.sin(f * Math.PI) : 0); }
  return 3 * Math.sin(wx * .2);
}
function texture(s, B, x, y, w, h){
  const bot = Math.min(y + h, VH + 10);
  ctx.lineWidth = 2;
  if (s.b === 0 || s.b === 3){
    const rowH = 24, y0 = y + B.capH + 4;
    for (let r = 0; ; r++){
      const yy = y0 + r * rowH; if (yy > bot) break;
      const off = (r % 2) * 26;
      for (let bx = -off; bx < w; bx += 52){
        const k = hash(s.x * .13 + bx * .71 + r * 5.3);
        ctx.fillStyle = k > .55 ? B.bodyAlt : B.body;
        rrect(x + bx + 2, yy + 2, 48, rowH - 4, 5); ctx.fill(); ctx.strokeStyle = B.bodyDark; ctx.stroke();
        if (s.b === 3 && k > .9){
          const cx = x + bx + 26, cy = yy + 12, g = .5 + .5 * Math.sin(time * 2 + k * 9);
          ctx.fillStyle = `rgba(127,240,224,${.15 + .2 * g})`; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, TAU); ctx.fill();
          ctx.fillStyle = '#7FF0E0'; ctx.beginPath(); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 4, cy); ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 4, cy); ctx.closePath(); ctx.fill();
        } else if (s.b === 0 && k < .07){
          ctx.fillStyle = '#7FAE58'; ctx.beginPath(); ctx.ellipse(x + bx + 14, yy + 4, 9, 4, 0, 0, TAU); ctx.fill();
        }
      }
    }
  } else if (s.b === 1){
    for (let r = 0; ; r++){
      const yy = y + 22 + r * 26; if (yy > bot) break;
      ctx.beginPath(); ctx.moveTo(x, yy);
      for (let xx = 0; xx <= w + 10; xx += 10) ctx.lineTo(x + xx, yy + 3 * Math.sin((s.x + xx) * .04 + r));
      for (let xx = w + 10; xx >= 0; xx -= 10) ctx.lineTo(x + xx, yy + 10 + 3 * Math.sin((s.x + xx) * .04 + r + 1));
      ctx.closePath(); ctx.fillStyle = B.bodyAlt; ctx.fill();
      ctx.fillStyle = B.bodyDark;
      for (let xx = 12; xx < w; xx += 30) if (hash(s.x * .3 + xx + r * 9) > .75){ ctx.beginPath(); ctx.arc(x + xx, yy + 18, 2.2, 0, TAU); ctx.fill(); }
    }
  } else {
    const cs = 34;
    for (let r = 0; ; r++){
      const gy = y + B.capH + 12 + r * cs; if (gy > bot) break;
      for (let c = 0; c * cs < w; c++){
        const k = hash(s.x * .07 + c * 1.3 + r * 7.7); if (k < .45) continue;
        const cx = x + c * cs + 14 + (k - .5) * 12, cy = gy + (k * 7 % 1) * 10, rad0 = 7 + k * 6;
        ctx.beginPath();
        for (let a = 0; a < 6; a++){ const ang = a / 6 * TAU + k * 3, rad = rad0 * (.75 + .25 * hash(k * 10 + a)); ctx.lineTo(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad * .8); }
        ctx.closePath(); ctx.fillStyle = B.bodyAlt; ctx.fill(); ctx.strokeStyle = B.bodyDark; ctx.stroke();
      }
    }
  }
}
function topDetail(s, B, x, y, w){
  if (s.b === 0){
    ctx.lineWidth = 1.5; ctx.strokeStyle = B.line; ctx.fillStyle = B.top;
    for (let xx = 6; xx < w - 6; xx += 9){
      const k = hash(s.x * .3 + xx); if (k < .5) continue;
      const hh = 4 + k * 6;
      ctx.beginPath(); ctx.moveTo(x + xx - 3, y + 1); ctx.lineTo(x + xx + (k - .5) * 4, y - hh); ctx.lineTo(x + xx + 3, y + 1); ctx.fill(); ctx.stroke();
    }
  } else if (s.b === 2){
    ctx.lineWidth = 2.5; ctx.strokeStyle = B.line; ctx.fillStyle = '#FFFFFF';
    for (let xx = 14; xx < w - 14; xx += 22){
      const k = hash(s.x * .2 + xx); if (k < .55) continue;
      const r = 4 + k * 4; ctx.beginPath(); ctx.arc(x + xx, y + 1, r, Math.PI, 0); ctx.fill(); ctx.stroke();
    }
  } else if (s.b === 3){
    for (let xx = 8; xx < w - 8; xx += 16){
      const k = hash(s.x * .5 + xx); if (k < .6) continue;
      const g = .5 + .5 * Math.sin(time * 3 + k * 20);
      ctx.fillStyle = `rgba(216,255,233,${.2 + .3 * g})`; ctx.beginPath(); ctx.arc(x + xx, y + 5, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#E4FFF1'; ctx.beginPath(); ctx.arc(x + xx, y + 5, 1.6, 0, TAU); ctx.fill();
    }
  }
}
function drawSeg(s){
  const B = BIOMES[s.b];
  let x = s.x - camX, y = s.y - camY;
  if (x > VW + 10 || x + s.w < -10 || y > VH + 30) return;
  if (s.ct > 0){ x += rand(-2, 2); y += rand(-1, 1); }
  const w = s.w, led = s.t === 'l', h = led ? 24 : Math.max(40, VH - y + 30), r = led ? 12 : 10;
  ctx.save();
  rr(x, y, w, h, r, led ? r : 0); ctx.fillStyle = B.body; ctx.fill();
  ctx.clip();
  texture(s, B, x, y, w, h);
  const capH = led ? 9 : B.capH;
  ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + w + 4, y - 4);

  else { neck = [3, -39 + Math.sin(t * 3) * .7]; feet = [[6, 0], [-5, 0]]; hands = [[9, -25], [-1, -24]]; }

  return {

function drawWeasel(o){
  const p = poseFor(o.pose, o.phase, o.t), L = WC.line;
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.ang){ ctx.translate(0, -28); ctx.rotate(o.ang); ctx.translate(0, 28); }
  ctx.scale((1 - o.sq * .5) * .95, (1 + o.sq) * .95);
  ctx.translate(0, p.bob);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const fo = (pass, col) => { if (pass){ ctx.lineWidth = 5; ctx.strokeStyle = L; ctx.stroke(); } else { ctx.fillStyle = col; ctx.fill(); } };
  const limb = (pts, w, col, pass) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[2][0], pts[2][1]); ctx.lineWidth = w + (pass ? 5 : 0); ctx.strokeStyle = pass ? L : col; ctx.stroke(); };
  const paw = (f, pass) => { ctx.beginPath(); ctx.ellipse(f[0] + 3, f[1] - 1.5, 6.5, 3.5, 0, 0, TAU); fo(pass, WC.paw); };
  const ell = (x, y, rx, ry, rot, col, pass) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); fo(pass, col); };

  // back limbs
  for (const pass of [true, false]){ limb(p.arms[1], 6, WC.furD, pass); hand(p.arms[1][2], WC.furD, pass); limb(p.legs[1], 8, WC.furD, pass); paw(p.legs[1][2], pass); }

  // body group
  const tail = tailPoly(o.t, o.amp), head = [p.neck[0] + 5, p.neck[1] - 9];
  for (const pass of [true, false]){
    polyPath(tail.L, tail.R); fo(pass, WC.fur);
    if (!pass){ polyPath(tail.L, tail.R, 9); ctx.fillStyle = WC.tip; ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(p.hip[0], p.hip[1]); ctx.lineTo(p.neck[0], p.neck[1]); ctx.lineWidth = 21 + (pass ? 5 : 0); ctx.strokeStyle = pass ? L : WC.fur; ctx.stroke();
    limb(p.legs[0], 8, WC.fur, pass); paw(p.legs[0][2], pass);
    ctx.beginPath(); ctx.arc(head[0] - 6, head[1] - 9, 5.6, 0, TAU); fo(pass, WC.fur);
    ell(head[0] + 11, head[1] + 2, 9.5, 6.2, .1, WC.fur, pass);
    ell(head[0], head[1], 11, 9.5, 0, WC.fur, pass);
    ctx.beginPath(); ctx.moveTo(head[0] - 5, head[1] - 7); ctx.lineTo(head[0] - 2, head[1] - 15); ctx.lineTo(head[0] + 1, head[1] - 9); ctx.lineTo(head[0] + 4, head[1] - 14); ctx.lineTo(head[0] + 5, head[1] - 7); ctx.closePath(); fo(pass, WC.fur);
  }
  // belly + face
  const hx = head[0], hy = head[1];
  ctx.beginPath(); ctx.moveTo(p.hip[0] + 3, p.hip[1] - 1); ctx.lineTo(p.neck[0] + 3, p.neck[1] + 3); ctx.lineWidth = 10; ctx.strokeStyle = WC.cream; ctx.stroke();
  ctx.fillStyle = WC.pink; ctx.beginPath(); ctx.arc(hx - 6, hy - 9, 3.1, 0, TAU); ctx.fill();
  ctx.fillStyle = WC.cream; ctx.beginPath(); ctx.ellipse(hx + 7, hy + 5, 9.5, 3.8, 0, 0, TAU); ctx.fill();
  // eye with smug lid
  ctx.save(); ctx.beginPath(); ctx.ellipse(hx + 4, hy - 4, 4.2, 5.2, 0, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.clip();
  const look = o.pose === 'hurt' ? [0, 0] : [1.8, .8];
  ctx.fillStyle = L; ctx.beginPath(); ctx.arc(hx + 4 + look[0], hy - 4 + look[1], 2.4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(hx + 5 + look[0], hy - 5 + look[1], .8, 0, TAU); ctx.fill();
  if (o.pose !== 'hurt'){ ctx.fillStyle = WC.fur; ctx.fillRect(hx - 2, hy - 11, 12, 4.8); }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(hx + 4, hy - 4, 4.2, 5.2, 0, 0, TAU); ctx.lineWidth = 1.8; ctx.strokeStyle = L; ctx.stroke();
  if (o.pose !== 'hurt'){ ctx.beginPath(); ctx.moveTo(hx - .2, hy - 6.2); ctx.lineTo(hx + 8.2, hy - 5.6); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(hx - .5, hy - 11); ctx.lineTo(hx + 8.5, hy - 8.2); ctx.lineWidth = 2.8; ctx.stroke();
  // nose + grin
  ctx.beginPath(); ctx.ellipse(hx + 20, hy + .5, 3.8, 3, 0, 0, TAU); ctx.fillStyle = WC.nose; ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(hx + 19, hy - .5, .9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 8, hy + 3.5); ctx.quadraticCurveTo(hx + 14, hy + (o.pose === 'hurt' ? 7 : 10.5), hx + 19, hy + 4.2); ctx.quadraticCurveTo(hx + 14, hy + 5.5, hx + 8, hy + 3.5);
  ctx.fillStyle = WC.mouth; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = L; ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(hx + 11.5, hy + 4.6); ctx.lineTo(hx + 13.8, hy + 5); ctx.lineTo(hx + 12.6, hy + 6.8); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(26,17,11,.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hx + 17, hy + 3); ctx.lineTo(hx + 28, hy); ctx.moveTo(hx + 17, hy + 4); ctx.lineTo(hx + 28, hy + 5); ctx.stroke();

  // bandana
  const k = [p.neck[0] - 5, p.neck[1] + 1], f = Math.sin(o.t * 16) * 3 * o.amp, f2 = Math.sin(o.t * 16 + 1.4) * 3 * o.amp;
  const ribbon = (dx, dy, ff) => { ctx.beginPath(); ctx.moveTo(k[0], k[1]); ctx.quadraticCurveTo(k[0] - 8, k[1] + dy * .5 + ff, k[0] + dx, k[1] + dy + ff * 1.5); ctx.lineTo(k[0] + dx + 3, k[1] + dy + 5 + ff); ctx.quadraticCurveTo(k[0] - 6, k[1] + dy * .3 + 3, k[0], k[1]); ctx.closePath(); };
  for (const [dx, dy, ff] of [[-15, -6, f], [-13, 4, f2]]){ ribbon(dx, dy, ff); ctx.fillStyle = WC.red; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = L; ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(k[0], k[1]); ctx.lineTo(p.neck[0] + 6, p.neck[1] + 2);
  ctx.lineWidth = 9; ctx.strokeStyle = L; ctx.stroke(); ctx.lineWidth = 5.5; ctx.strokeStyle = WC.red; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.neck[0] + 1, p.neck[1] + 3); ctx.lineTo(p.neck[0] + 10, p.neck[1] + 1); ctx.lineTo(p.neck[0] + 8, p.neck[1] + 11); ctx.closePath();
  ctx.fillStyle = WC.red; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = L; ctx.stroke();
  ctx.strokeStyle = WC.redD; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(p.neck[0] + 4, p.neck[1] + 4); ctx.lineTo(p.neck[0] + 7.5, p.neck[1] + 8); ctx.stroke();
  ctx.beginPath(); ctx.arc(k[0], k[1], 3, 0, TAU); ctx.fillStyle = WC.red; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = L; ctx.stroke();

  // front arm
  for (const pass of [true, false]){ limb(p.arms[0], 6, WC.fur, pass); hand(p.arms[0][2], WC.fur, pass); }
  ctx.restore();
}
function drawPlayer(){
  const cx = P.x + PW / 2 - camX, fy = P.y + PH - camY;
  let gy = null;
  for (const s of segs){ if (s.falling) continue; if (P.x + PW / 2 >= s.x && P.x + PW / 2 <= s.x + s.w && s.y >= P.y + PH - 2 && (gy === null || s.y < gy)) gy = s.y; }
  if (gy !== null && state !== 'dead'){
    const d = gy - (P.y + PH), a = clamp(1 - d / 260, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${.22 * a})`; ctx.beginPath(); ctx.ellipse(cx, gy - camY + 1, 16 * (.5 + .5 * a), 4 * (.5 + .5 * a), 0, 0, TAU); ctx.fill();
  }
  let pose = 'run';
  if (state === 'title') pose = 'idle'; else if (state === 'dead') pose = 'hurt'; else if (!P.ground) pose = P.vy < 0 ? 'rise' : 'fall';
  let ang = 0;
  if (state === 'dead') ang = P.ang;
  else if (P.spin > 0){ const u = 1 - P.spin; ang = TAU * (1 - Math.pow(1 - u, 3)); }
  drawWeasel({ x:cx, y:fy, pose, phase:P.phase, t:time, sq:P.sq, ang, amp:state === 'title' ? .4 : speed / 300 });
}

// ---------- particles & effects ----------
function star(x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 8; i++){ const a = i / 8 * TAU - Math.PI / 2, rad = i % 2 ? r * .4 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
}
function drawParts(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    const u = 1 - p.life / p.max;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const x = p.x - camX, y = p.y - camY, fade = Math.min(1, u * 5, (1 - u) * 5);

      case 'puff': p.vx *= .92; p.vy *= .92; ctx.globalAlpha = (1 - u) * .85; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(x, y, p.r * (1 + u * 1.2), 0, TAU); ctx.fill(); break;
      case 'star': p.vy += 400 * dt; ctx.globalAlpha = 1 - u; star(x, y, p.r * (1 - u * .5), p.col); break;
      case 'ring': ctx.globalAlpha = 1 - u; ctx.strokeStyle = p.col; ctx.lineWidth = 3 * (1 - u) + 1; ctx.beginPath(); ctx.arc(x, y, p.r + u * (p.R || 26), 0, TAU); ctx.stroke(); break;
      case 'chunk':
        p.vy += G * .6 * dt; p.rot += p.vr * dt; ctx.globalAlpha = 1;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.strokeStyle = p.line; ctx.lineWidth = 2;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); ctx.strokeRect(-p.r, -p.r, p.r * 2, p.r * 2); ctx.restore(); break;
      case 'petal':
        p.vy = 20 + Math.sin(time * 2 + p.rot) * 25; p.rot += dt * 3; ctx.globalAlpha = fade * .9;
        ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, TAU); ctx.fill(); ctx.restore(); break;
      case 'sand': ctx.globalAlpha = fade * .5; ctx.strokeStyle = p.col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + p.r, y); ctx.stroke(); break;
      case 'snow': p.vx += Math.sin(time * 2 + p.y * .05) * 10 * dt; ctx.globalAlpha = fade * .9; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill(); break;
      case 'fly': {
        p.vx += Math.cos(time * 2 + p.rot) * 20 * dt; p.vy += Math.sin(time * 2.6 + p.rot) * 20 * dt;
        const g = .5 + .5 * Math.sin(time * 6 + p.rot * 5);
        ctx.globalAlpha = fade * (.3 + .7 * g); ctx.fillStyle = 'rgba(201,255,138,.25)'; ctx.beginPath(); ctx.arc(x, y, p.r * 4, 0, TAU); ctx.fill();
        ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(x, y, p.r, 0, TAU); ctx.fill(); break; }
    }
  }

}
function drawPopups(dt){
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (let i = popups.length - 1; i >= 0; i--){
    const p = popups[i];
    p.life -= dt; if (p.life <= 0){ popups.splice(i, 1); continue; }
    const u = 1 - p.life / p.max;
    const s = (p.big ? 1.4 : 1) * (u < .15 ? u / .15 * 1.25 : 1.25 - .25 * Math.min(1, (u - .15) * 4));
    ctx.save(); ctx.translate(p.x - camX, p.y - camY - u * 30); ctx.scale(s, s);
    ctx.globalAlpha = Math.min(1, p.life / p.max * 3);
    ctx.font = "20px 'Lilita One', system-ui, sans-serif";
    ctx.lineWidth = 5; ctx.strokeStyle = '#1A110B'; ctx.strokeText(p.txt, 0, 0);

}
function drawLines(dt){
  if (state === 'play' && speed > 300 && Math.random() < (speed - 300) / 130 * .9) lines.push({ x:VW + 20, y:rand(20, VH - 20), len:rand(40, 110), v:rand(900, 1400) });
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = lines.length - 1; i >= 0; i--){
    const l = lines[i]; l.x -= l.v * dt;
    if (l.x + l.len < 0){ lines.splice(i, 1); continue; }
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke();
  }
}

// ---------- frame ----------
function render(dt){
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  const sx = shake > 0 ? rand(-shake, shake) : 0, sy = shake > 0 ? rand(-shake, shake) : 0;
  const bb = biomeBlend(camX + VW * .5);
  drawSky(bb);
  ctx.save(); ctx.translate(sx * .3, sy * .3);
  drawLayer(drawFar, bb); drawLayer(drawMid, bb);
  ctx.restore();
  ctx.save(); ctx.translate(sx, sy);
  for (const s of segs) drawSeg(s);
  for (const s of segs) drawDeco(s);
  for (const p of springs) drawSpring(p);
  drawRecordFlag();
  drawCoins();
  drawBubbles();
  drawCritters();
  drawPlayer();
  drawPowerFx();
  drawParts(dt);
  drawPopups(dt);
  ctx.restore();
  drawLines(dt);
  drawFrenzyTint();
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, VW, VH); }
}

reset();
let prev = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, Math.max(0, (now - prev) / 1000)); prev = now; time += dt;
  if (state === 'play') update(dt);
  else if (state === 'dead'){
    stateT += dt; P.vy += G * dt; P.y += P.vy * dt; P.ang += dt * 9;
    if (stateT > .75 && !panelShown) showDeath();
  } else P.phase = time;
  shake = Math.max(0, shake - dt * 25); flash = Math.max(0, flash - dt * 1.5);
  for (const p of springs) p.comp = Math.max(0, p.comp - dt * 4);
  ambient(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__weasel = { press, start, timeToLand, pw, get critters(){ return critters; }, get bubbles(){ return bubbles; }, get segs(){ return segs; }, get state(){ return state; }, get P(){ return P; }, get dist(){ return dist; }, get got(){ return got; }, step:(dt, nr) => { time += dt; if (state === 'play') update(dt); if (!nr) render(dt); } };
})();
